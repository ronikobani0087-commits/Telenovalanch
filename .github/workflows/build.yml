name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: |
          mkdir www && cp index.html www/
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Telenova Launcher" com.telenova.launcher --web-dir=www
          npx cap add android
          npx cap sync android
          python3 - <<'EOF'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p).read()
          L='<category android:name="android.intent.category.LAUNCHER" />'
          s=s.replace(L, L+'\n<category android:name="android.intent.category.HOME" />\n<category android:name="android.intent.category.DEFAULT" />\n<category android:name="android.intent.category.LEANBACK_LAUNCHER" />')
          s=s.replace('<application','<uses-feature android:name="android.software.leanback" android:required="false" />\n<uses-feature android:name="android.hardware.touchscreen" android:required="false" />\n<application',1)
          open(p,'w').write(s)
          EOF
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: telenova-launcher-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
